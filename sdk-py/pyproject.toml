[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "golem-team-sdk"
version = "0.1.0"
authors = [
  { name="Golem", email="info@golem.team" },
]
description = "Golem (golem.team), AI Detection and Response for coding agents: sign and record AI agent tool calls into a tamper-evident ledger."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
keywords = ["ai-agents", "agent-security", "coding-agents", "mcp", "audit", "tamper-evident", "langchain", "openai-agents", "crewai", "llamaindex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "cbor2>=5.6.0",
    "cryptography>=41.0.0",
    "ecdsa>=0.18.0",
    "protobuf>=4.25.0",
]

[project.optional-dependencies]
# Convention: framework adapter extras are added ONLY when the adapter
# has a hard import dependency on the framework (subclasses an ABC,
# imports a public type). Adapters that duck-type the framework's
# callback payload (CrewAI, LlamaIndex, Semantic Kernel) intentionally
# have no extra — they work against the bare `golem-team-sdk` install.
# Don't add `crewai = [...]` etc. unless you've also added a hard
# import to that adapter module. See sdk-py/README.md for the matrix.
dev = [
    "pytest>=7.0",
]
aws = [
    "boto3>=1.34.0",
]
gcp = [
    "google-cloud-storage>=2.14.0",
]
azure = [
    "azure-storage-blob>=12.19.0",
]
all = [
    "boto3>=1.34.0",
    "google-cloud-storage>=2.14.0",
    "azure-storage-blob>=12.19.0",
]
langchain = [
    # Only the callback-handler base class is required; pulling the
    # full `langchain` meta-package would double the install footprint
    # and most agent codebases already have `langchain-core` directly.
    "langchain-core>=0.1",
]
openai-agents = [
    # The TracingProcessor abstract class is the public observability
    # hook point for the OpenAI Agents SDK. Lower bound matches the
    # earliest public release that exposes the trace processor API
    # stably; no upper bound — the ABC has been backward-compatible.
    "openai-agents>=0.0.1",
]

[project.urls]
Homepage = "https://golem.team"
Documentation = "https://golem.team/llms-full.txt"
Repository = "https://github.com/GolemTeam/golem-team-sdk"
"Record format" = "https://golem.team/ledger-format.md"

[project.scripts]
golem-evidence = "golem_sdk.evidence_cli:main"
